<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Perform Transfer</title>
</head>

<body>
	<h4>Enter transfer details</h4>

	<div class="container">
		<form action="/transactional/performTransfer" th:object="${currentAccountDetail}" method="POST">
		 <p>Customer ID: <span th:text="${currentAccountDetail.customerID}"></span>
		<p>
		<p>
		<input type="text" placeholder="Customer ID:" th:field="${currentAccountDetail.customerID}"  th:value="${currentAccountDetail.customerID}"/>
		</p>
		<p>Transfer Amount:</p>
		<p>
		<input type="text" placeholder="Transfer Amount" th:field="${currentAccountDetail.intransferamount}"  th:value="0"/>
		</p>
		<p>Account Amount:</p>
		<p>
		<input type="text" placeholder="Account number" th:field="${currentAccountDetail.accountNumber}"  th:value="0"/>
		</p>
		<p>Target Account number:</p>
		<p>
		<input type="text" placeholder="Target Account" th:field="${currentAccountDetail.targetAccount}"  th:value="0"/>
		</p>
		<p>AccountType:</p>
		<p>
		<input type="text" placeholder="AccountType" th:field="${currentAccountDetail.accountType}"  th:value="0"/>
		</p>
		<p>BankName:</p>
		<p>
		<input type="text" placeholder="BankName" th:field="${currentAccountDetail.bankName}"  th:value="0"/>
		</p>
		<p>BranchCode:</p>
		<p>
		<input type="text" placeholder="BranchCode" th:field="${currentAccountDetail.branchCode}"  th:value="0"/>
		</p>
		
		<button type="submit">Pay</button>
		
		</form>
	</div>
	
</body>

</html>
